[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-guardian"
version = "0.2.0"
description = "Agentic AI guardian that discovers, investigates, prioritises, remediates and independently validates software supply-chain risks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary (hackathon prototype)" }
dependencies = ["pyyaml>=6"]   # only for pnpm-lock.yaml; everything else uses the standard library

[project.optional-dependencies]
llm = ["google-genai>=1.0.0", "anthropic>=2.12"]      # Official Google GenAI SDK (google.genai) + Anthropic SDK
api = ["fastapi>=0.115", "uvicorn>=0.30"]   # `guardian serve` for the dashboard
all = ["supply-chain-guardian[llm,api]"]

[project.scripts]
guardian = "guardian.cli:main"

[tool.setuptools.packages.find]
include = ["guardian*"]

[tool.setuptools.package-data]
"guardian.agents.prompts" = ["*.md"]
"guardian.policies" = ["*.json"]
"guardian.web" = ["*.html", "*.css", "*.js"]
